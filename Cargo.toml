[workspace]
members = [
  "crates/contract-deployer",
  "crates/common"
]
default-members = ["crates/contract-deployer"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Vedant Chainani <vedantchainani1084@gmail.com>"]
repository = "https://github.com/Envoy-VC/blacksmith"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9.5"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
alloy = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dotenvy = "0.15"

# unified lints for the whole workspace (Rust 1.79+)
[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "warn"
missing_docs = "allow"

# [workspace.lints.clippy]
# pedantic = { level = "warn", priority = -1 }
# unwrap_used = "warn"
# expect_used = "warn"
# dbg_macro = "warn"

# [profile.release]
# codegen-units = 1
# lto = "thin"
# opt-level = "z"
# strip = "symbols"
# panic = "abort"
